{% extends 'base.html' %}

{% block title %}{{ title }} - Regional Scholarship Portal{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3" style="width: 80px; height: 80px; background: var(--danger-light);">
                    <i class="bi bi-exclamation-triangle display-5" style="color: var(--danger);"></i>
                </div>
                <h2 class="h3 fw-bold">{{ title }}</h2>
                <p class="text-muted">{{ message }}</p>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <div class="alert alert-warning small mb-4">
                        <i class="bi bi-info-circle me-2"></i>
                        This action cannot be undone. All associated data will be permanently removed.
                    </div>

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex gap-2 justify-content-center">
                            <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">
                                <i class="bi bi-x-circle me-2"></i>Cancel
                            </a>
                            <button type="submit" class="btn btn-danger">
                                <i class="bi bi-trash me-2"></i>Confirm Delete
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
